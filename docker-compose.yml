version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: finlo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: finlo
      POSTGRES_PASSWORD: finlo_secret
      POSTGRES_DB: finlo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/migrations/000001_init_schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finlo -d finlo"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-10-02T17-50-41Z
    container_name: finlo-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finlo-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://finlo:finlo_secret@postgres:5432/finlo?sslmode=disable"
      JWT_SECRET: "super-secret-finlo-jwt-key-minimum-32-chars-long"
      S3_ENDPOINT: "http://minio:9000"
      S3_BUCKET: "finlo-attachments"
      S3_ACCESS_KEY: "minioadmin"
      S3_SECRET_KEY: "minioadmin"
      STORAGE_MODE: "postgres"

volumes:
  pgdata:
  miniodata:
